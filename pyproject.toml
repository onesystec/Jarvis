[project]
name = "asistente"
version = "0.1.0"
description = "Asistente de voz local-first estilo JARVIS, con permisos por herramienta y auditoría"
authors = [
    { name = "maugos1813", email = "maufabagosgam@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "openwakeword==0.6.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
asistente = "asistente.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
# Solo macOS: reduce la superficie de dependencias y evita paquetes exclusivos de Linux.
environments = ["sys_platform == 'darwin'"]
